<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NEXUS AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Google Sites iframe absolute fill fix */
    html, body {
      position: absolute;
      top: 0; bottom: 0; left: 0; right: 0;
      width: 100%; height: 100%;
      margin: 0; padding: 0;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    
    .scroll-custom::-webkit-scrollbar { width: 4px; }
    .scroll-custom::-webkit-scrollbar-track { background: transparent; }
    .scroll-custom::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    
    /* Dark/Light markdown text readability fixes */
    .prose-dark p, .prose-dark li { color: #d1d5db; line-height: 1.6; }
    .prose-dark code { background: #1f2937; color: #f3f4f6; padding: 2px 6px; border-radius: 4px; font-size: 0.875em; }
    .prose-dark pre { background: #111827; padding: 12px; border-radius: 8px; border: 1px solid #374151; overflow-x: auto; }
    
    .prose-user p, .prose-user li { color: #000000; font-weight: 500; line-height: 1.5; }
    .prose-user code { background: #e5e7eb; color: #000000; padding: 2px 6px; border-radius: 4px; font-size: 0.875em; }
  </style>
</head>
<body class="bg-black text-white flex flex-col h-full w-full select-none">

  <!-- TOP BAR -->
  <header class="h-14 border-b border-zinc-800 bg-black flex items-center justify-between px-4 z-10 shrink-0">
    <div class="flex items-center gap-3">
      <button id="btn-sidebar" class="w-9 h-9 flex items-center justify-center rounded-lg border border-zinc-800 hover:bg-zinc-900 transition-colors">
        <i class="fa-solid fa-bars text-zinc-300"></i>
      </button>
      <div class="flex items-center gap-2">
        <div class="w-7 h-7 bg-white text-black font-extrabold flex items-center justify-center rounded text-xs tracking-tighter">NX</div>
        <span class="font-bold tracking-wider text-sm">NEXUS <span class="text-[10px] text-zinc-500 font-mono font-normal">AI</span></span>
      </div>
    </div>
    
    <div class="flex items-center gap-2">
      <button id="btn-key-status" class="px-2.5 py-1 rounded-full text-xs font-mono border border-zinc-800 flex items-center gap-1.5 transition-all">
        <span id="key-dot" class="w-2 h-2 rounded-full bg-red-500"></span>
        <span id="key-text" class="text-zinc-400">NO KEY</span>
      </button>
      <button id="btn-settings" class="w-9 h-9 flex items-center justify-center rounded-lg border border-zinc-800 hover:bg-zinc-900 text-zinc-300 transition-colors">
        <i class="fa-solid fa-gear"></i>
      </button>
    </div>
  </header>

  <!-- MAIN BODY LAYOUT -->
  <div class="flex-1 flex relative overflow-hidden">
    
    <!-- SIDEBAR DRAWER -->
    <aside id="sidebar" class="absolute inset-y-0 left-0 w-72 bg-black border-r border-zinc-800 z-20 transform -translate-x-full transition-transform duration-200 flex flex-col">
      <div class="p-3 border-b border-zinc-800 flex items-center gap-2">
        <button id="btn-new-chat" class="flex-1 bg-white hover:bg-zinc-200 text-black font-semibold py-2 px-3 rounded-lg flex items-center justify-center gap-2 text-sm transition-colors">
          <i class="fa-solid fa-plus text-xs"></i> New Chat
        </button>
        <button id="btn-close-sidebar" class="w-9 h-9 flex items-center justify-center border border-zinc-800 rounded-lg text-zinc-400 hover:text-white">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      
      <div id="chat-list" class="flex-1 overflow-y-auto p-2 space-y-1 scroll-custom">
        <!-- Chat list items injected here -->
      </div>
      
      <div class="p-3 border-t border-zinc-800 text-xs text-zinc-500 flex justify-between items-center">
        <span>Persistent Storage</span>
        <button id="btn-clear-history" class="hover:text-red-400"><i class="fa-solid fa-trash-can"></i> Clear</button>
      </div>
    </aside>

    <!-- BACKDROP FOR MOBILE SIDEBAR -->
    <div id="sidebar-backdrop" class="absolute inset-0 bg-black/60 z-10 hidden"></div>

    <!-- CHAT VIEW AREA -->
    <main class="flex-1 flex flex-col h-full w-full min-w-0 bg-black relative">
      
      <!-- MESSAGES CONTAINER -->
      <div id="messages-container" class="flex-1 overflow-y-auto p-4 space-y-4 scroll-custom">
        <!-- Default Welcome State -->
        <div id="welcome-screen" class="h-full flex flex-col items-center justify-center text-center p-6 max-w-md mx-auto">
          <div class="w-12 h-12 bg-white text-black text-xl font-bold flex items-center justify-center rounded-xl mb-4 shadow-lg shadow-white/5">N</div>
          <h1 class="text-xl font-bold mb-2">Welcome to NEXUS AI</h1>
          <p class="text-xs text-zinc-400 mb-6">Enter your Google Gemini API key in settings to start chatting. Your key and conversations are saved directly in your browser.</p>
          
          <div class="grid grid-cols-1 w-full gap-2 text-left">
            <button class="prompt-starter text-xs p-3 rounded-lg border border-zinc-800 bg-zinc-950 hover:border-zinc-600 transition-colors">
              <span class="font-semibold block text-white mb-0.5">💡 Coding Assistant</span>
              <span class="text-zinc-500">Write a JavaScript function to format dates</span>
            </button>
            <button class="prompt-starter text-xs p-3 rounded-lg border border-zinc-800 bg-zinc-950 hover:border-zinc-600 transition-colors">
              <span class="font-semibold block text-white mb-0.5">📝 Creative Writer</span>
              <span class="text-zinc-500">Draft a concise intro email to a potential client</span>
            </button>
          </div>
        </div>
      </div>

      <!-- INPUT BAR -->
      <div class="p-3 border-t border-zinc-800 bg-black">
        <form id="chat-form" class="max-w-3xl mx-auto flex items-end gap-2 bg-zinc-950 border border-zinc-800 rounded-xl p-2 focus-within:border-zinc-600 transition-colors">
          <textarea id="user-input" rows="1" placeholder="Message NEXUS..." class="flex-1 bg-transparent text-sm text-white placeholder-zinc-500 focus:outline-none resize-none max-h-32 p-1.5 scroll-custom"></textarea>
          <button type="submit" id="btn-send" class="w-8 h-8 bg-white hover:bg-zinc-200 text-black rounded-lg flex items-center justify-center shrink-0 transition-colors disabled:opacity-40">
            <i class="fa-solid fa-arrow-up text-xs"></i>
          </button>
        </form>
        <div class="text-[10px] text-zinc-600 text-center mt-2 font-mono">
          Model: <span id="current-model-display">gemini-3.8-flash</span>
        </div>
      </div>

    </main>
  </div>

  <!-- SETTINGS MODAL -->
  <div id="settings-modal" class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-zinc-950 border border-zinc-800 rounded-xl w-full max-w-md p-5 space-y-4 shadow-2xl">
      <div class="flex justify-between items-center border-b border-zinc-800 pb-3">
        <h3 class="font-bold text-sm flex items-center gap-2"><i class="fa-solid fa-sliders"></i> NEXUS Settings</h3>
        <button id="btn-close-settings" class="text-zinc-500 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>
      
      <!-- API Key Section -->
      <div class="space-y-2">
        <label class="text-xs font-semibold text-zinc-300 block">Gemini API Key</label>
        <div class="flex gap-2">
          <input type="password" id="api-key-input" placeholder="AIzaSy..." class="flex-1 bg-black border border-zinc-800 rounded-lg px-3 py-2 text-xs font-mono text-white focus:outline-none focus:border-zinc-500">
          <button id="btn-save-key" class="bg-white hover:bg-zinc-200 text-black px-3 py-2 rounded-lg text-xs font-bold transition-colors">Save</button>
        </div>
        <p class="text-[11px] text-zinc-500">
          Need a key? Get a free API Key from 
          <a href="https://aistudio.google.com/app/apikey" target="_blank" class="text-white underline hover:text-zinc-300">Google AI Studio <i class="fa-solid fa-arrow-up-right-from-square text-[9px]"></i></a>
        </p>
      </div>

      <!-- Model Selection -->
      <div class="space-y-2 pt-2 border-t border-zinc-900">
        <label class="text-xs font-semibold text-zinc-300 block">AI Model Endpoint</label>
        <select id="model-select" class="w-full bg-black border border-zinc-800 rounded-lg p-2 text-xs text-white focus:outline-none focus:border-zinc-500 font-mono">
          <option value="gemini-3.8-flash" selected>gemini-3.8-flash (Recommended / Fast)</option>
          <option value="gemini-3.5-flash-lite">gemini-3.5-flash-lite (Ultra-Fast / High Capacity)</option>
          <option value="gemini-3.1-pro-preview">gemini-3.1-pro-preview (Advanced Reasoning)</option>
        </select>
      </div>

      <!-- Backup Export/Import -->
      <div class="space-y-2 pt-2 border-t border-zinc-900">
        <label class="text-xs font-semibold text-zinc-300 block">Data & Storage</label>
        <div class="flex gap-2">
          <button id="btn-export" class="flex-1 border border-zinc-800 hover:bg-zinc-900 py-1.5 rounded text-xs text-zinc-300"><i class="fa-solid fa-download mr-1"></i> Export Data</button>
          <button id="btn-import" class="flex-1 border border-zinc-800 hover:bg-zinc-900 py-1.5 rounded text-xs text-zinc-300"><i class="fa-solid fa-upload mr-1"></i> Import Data</button>
          <input type="file" id="file-import" class="hidden" accept=".json">
        </div>
      </div>

      <div class="pt-2 text-center">
        <button id="btn-done-settings" class="w-full bg-zinc-900 hover:bg-zinc-800 border border-zinc-700 text-white font-semibold py-2 rounded-lg text-xs transition-colors">Done</button>
      </div>
    </div>
  </div>

  <script>
    // Storage Engine (Cross-Origin Frame Support for Google Sites)
    const Storage = {
      set(key, val) {
        const str = typeof val === 'string' ? val : JSON.stringify(val);
        try { localStorage.setItem(key, str); } catch(e){}
        try { sessionStorage.setItem(key, str); } catch(e){}
        document.cookie = `${key}=${encodeURIComponent(str)}; path=/; max-age=31536000; SameSite=Lax`;
      },
      get(key) {
        try { if (localStorage.getItem(key)) return localStorage.getItem(key); } catch(e){}
        try { if (sessionStorage.getItem(key)) return sessionStorage.getItem(key); } catch(e){}
        const match = document.cookie.match(new RegExp('(^| )' + key + '=([^;]+)'));
        if (match) return decodeURIComponent(match[2]);
        return null;
      }
    };

    // Application State
    let apiKey = Storage.get('NEXUS_API_KEY') || '';
    let selectedModel = Storage.get('NEXUS_MODEL') || 'gemini-3.8-flash';
    let chats = JSON.parse(Storage.get('NEXUS_CHATS') || '[]');
    let currentChatId = Storage.get('NEXUS_ACTIVE_CHAT') || null;

    // UI Element References
    const sidebar = document.getElementById('sidebar');
    const sidebarBackdrop = document.getElementById('sidebar-backdrop');
    const btnSidebar = document.getElementById('btn-sidebar');
    const btnCloseSidebar = document.getElementById('btn-close-sidebar');
    const settingsModal = document.getElementById('settings-modal');
    const btnSettings = document.getElementById('btn-settings');
    const btnCloseSettings = document.getElementById('btn-close-settings');
    const btnDoneSettings = document.getElementById('btn-done-settings');
    const apiKeyInput = document.getElementById('api-key-input');
    const btnSaveKey = document.getElementById('btn-save-key');
    const keyDot = document.getElementById('key-dot');
    const keyText = document.getElementById('key-text');
    const modelSelect = document.getElementById('model-select');
    const currentModelDisplay = document.getElementById('current-model-display');
    const chatForm = document.getElementById('chat-form');
    const userInput = document.getElementById('user-input');
    const messagesContainer = document.getElementById('messages-container');
    const welcomeScreen = document.getElementById('welcome-screen');
    const chatList = document.getElementById('chat-list');
    const btnNewChat = document.getElementById('btn-new-chat');

    // Initialization
    function init() {
      updateKeyUI();
      modelSelect.value = selectedModel;
      currentModelDisplay.textContent = selectedModel;
      renderChatList();
      if (currentChatId && chats.some(c => c.id === currentChatId)) {
        loadChat(currentChatId);
      } else if (chats.length > 0) {
        loadChat(chats[0].id);
      }
    }

    function updateKeyUI() {
      if (apiKey && apiKey.trim().length > 10) {
        keyDot.className = "w-2 h-2 rounded-full bg-emerald-500 shadow-sm shadow-emerald-500/50";
        keyText.textContent = "KEY SAVED";
        keyText.className = "text-emerald-400 font-bold";
        apiKeyInput.value = apiKey;
      } else {
        keyDot.className = "w-2 h-2 rounded-full bg-red-500";
        keyText.textContent = "NO KEY";
        keyText.className = "text-zinc-500";
      }
    }

    // Sidebar Toggles
    btnSidebar.onclick = () => { sidebar.classList.remove('-translate-x-full'); sidebarBackdrop.classList.remove('hidden'); };
    const closeSidebar = () => { sidebar.classList.add('-translate-x-full'); sidebarBackdrop.classList.add('hidden'); };
    btnCloseSidebar.onclick = closeSidebar;
    sidebarBackdrop.onclick = closeSidebar;

    // Settings Modal
    btnSettings.onclick = () => { settingsModal.classList.remove('hidden'); };
    const closeSettings = () => { settingsModal.classList.add('hidden'); };
    btnCloseSettings.onclick = closeSettings;
    btnDoneSettings.onclick = closeSettings;

    // Save API Key
    btnSaveKey.onclick = () => {
      const key = apiKeyInput.value.trim();
      if (key) {
        apiKey = key;
        Storage.set('NEXUS_API_KEY', apiKey);
        updateKeyUI();
        alert('API Key saved successfully!');
      }
    };

    // Model Select
    modelSelect.onchange = (e) => {
      selectedModel = e.target.value;
      Storage.set('NEXUS_MODEL', selectedModel);
      currentModelDisplay.textContent = selectedModel;
    };

    // Chat Management
    btnNewChat.onclick = () => {
      const newChat = {
        id: 'chat_' + Date.now(),
        title: 'New Conversation',
        messages: []
      };
      chats.unshift(newChat);
      Storage.set('NEXUS_CHATS', chats);
      renderChatList();
      loadChat(newChat.id);
      closeSidebar();
    };

    function renderChatList() {
      chatList.innerHTML = '';
      chats.forEach(chat => {
        const item = document.createElement('div');
        const isActive = chat.id === currentChatId;
        item.className = `p-2.5 rounded-lg text-xs cursor-pointer flex items-center justify-between group transition-colors ${isActive ? 'bg-zinc-800 text-white font-semibold' : 'text-zinc-400 hover:bg-zinc-900 hover:text-white'}`;
        item.innerHTML = `
          <div class="flex items-center gap-2 truncate flex-1">
            <i class="fa-regular fa-message text-[10px]"></i>
            <span class="truncate">${chat.title}</span>
          </div>
          <button class="btn-del-chat opacity-0 group-hover:opacity-100 hover:text-red-400 p-1" data-id="${chat.id}">
            <i class="fa-solid fa-trash"></i>
          </button>
        `;
        item.onclick = (e) => {
          if (!e.target.closest('.btn-del-chat')) {
            loadChat(chat.id);
            closeSidebar();
          }
        };
        chatList.appendChild(item);
      });

      document.querySelectorAll('.btn-del-chat').forEach(btn => {
        btn.onclick = (e) => {
          e.stopPropagation();
          const id = btn.getAttribute('data-id');
          chats = chats.filter(c => c.id !== id);
          Storage.set('NEXUS_CHATS', chats);
          if (currentChatId === id) {
            currentChatId = chats.length > 0 ? chats[0].id : null;
          }
          renderChatList();
          if (currentChatId) loadChat(currentChatId); else clearMessagesArea();
        };
      });
    }

    function loadChat(id) {
      currentChatId = id;
      Storage.set('NEXUS_ACTIVE_CHAT', id);
      renderChatList();
      const chat = chats.find(c => c.id === id);
      messagesContainer.innerHTML = '';
      if (!chat || chat.messages.length === 0) {
        messagesContainer.appendChild(welcomeScreen);
      } else {
        chat.messages.forEach(msg => appendMessageUI(msg.role, msg.content));
      }
      scrollToBottom();
    }

    function clearMessagesArea() {
      messagesContainer.innerHTML = '';
      messagesContainer.appendChild(welcomeScreen);
    }

    document.getElementById('btn-clear-history').onclick = () => {
      if (confirm('Clear all conversation history?')) {
        chats = [];
        currentChatId = null;
        Storage.set('NEXUS_CHATS', chats);
        Storage.set('NEXUS_ACTIVE_CHAT', null);
        renderChatList();
        clearMessagesArea();
      }
    };

    // Auto-expand Textarea
    userInput.addEventListener('input', () => {
      userInput.style.height = 'auto';
      userInput.style.height = Math.min(userInput.scrollHeight, 128) + 'px';
    });

    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        chatForm.dispatchEvent(new Event('submit'));
      }
    });

    // Starters
    document.querySelectorAll('.prompt-starter').forEach(btn => {
      btn.onclick = () => {
        const txt = btn.querySelector('.text-zinc-500').textContent;
        userInput.value = txt;
        chatForm.dispatchEvent(new Event('submit'));
      };
    });

    // Send & API Interaction
    chatForm.onsubmit = async (e) => {
      e.preventDefault();
      const text = userInput.value.trim();
      if (!text) return;

      if (!apiKey) {
        settingsModal.classList.remove('hidden');
        alert('Please enter your Gemini API key to proceed.');
        return;
      }

      if (!currentChatId) {
        const newChat = { id: 'chat_' + Date.now(), title: text.slice(0, 25), messages: [] };
        chats.unshift(newChat);
        currentChatId = newChat.id;
      }

      const activeChat = chats.find(c => c.id === currentChatId);
      if (activeChat.messages.length === 0) {
        activeChat.title = text.slice(0, 28);
        messagesContainer.innerHTML = '';
      }

      // Add User Message
      activeChat.messages.push({ role: 'user', content: text });
      appendMessageUI('user', text);
      userInput.value = '';
      userInput.style.height = 'auto';
      scrollToBottom();

      // Placeholder for Assistant
      const assistantCard = appendMessageUI('assistant', '<i class="fa-solid fa-circle-notch fa-spin text-zinc-500"></i> Thinking...');
      scrollToBottom();

      try {
        const responseText = await fetchGeminiResponse(activeChat.messages);
        assistantCard.querySelector('.msg-content').innerHTML = marked.parse(responseText);
        activeChat.messages.push({ role: 'assistant', content: responseText });
        Storage.set('NEXUS_CHATS', chats);
        renderChatList();
      } catch (err) {
        assistantCard.querySelector('.msg-content').innerHTML = `
          <div class="p-3 bg-red-950/50 border border-red-800 rounded-lg text-red-300 text-xs font-mono">
            ⚠️ <strong>API Error:</strong> ${err.message}
          </div>
        `;
      }
      scrollToBottom();
    };

    async function fetchGeminiResponse(history) {
      const contents = history.map(m => ({
        role: m.role === 'user' ? 'user' : 'model',
        parts: [{ text: m.content }]
      }));

      const url = `https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${apiKey}`;
      
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents })
      });

      const data = await res.json();
      if (!res.ok) {
        throw new Error(data.error?.message || `HTTP ${res.status}`);
      }

      return data.candidates[0].content.parts[0].text;
    }

    function appendMessageUI(role, content) {
      if (welcomeScreen.parentNode === messagesContainer) {
        messagesContainer.removeChild(welcomeScreen);
      }

      const wrap = document.createElement('div');
      wrap.className = `flex gap-3 ${role === 'user' ? 'justify-end' : 'justify-start'}`;

      if (role === 'user') {
        wrap.innerHTML = `
          <div class="max-w-[85%] bg-white text-black px-4 py-2.5 rounded-2xl rounded-tr-sm shadow-md prose-user text-xs">
            <div class="msg-content">${content}</div>
          </div>
        `;
      } else {
        wrap.innerHTML = `
          <div class="w-7 h-7 rounded-lg bg-zinc-900 border border-zinc-800 flex items-center justify-center shrink-0 text-xs font-bold text-white">N</div>
          <div class="max-w-[85%] bg-zinc-950 border border-zinc-800 px-4 py-3 rounded-2xl rounded-tl-sm prose-dark text-xs">
            <div class="msg-content">${typeof content === 'string' && !content.includes('fa-spin') ? marked.parse(content) : content}</div>
          </div>
        `;
      }

      messagesContainer.appendChild(wrap);
      return wrap;
    }

    function scrollToBottom() {
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    // Export/Import Features
    document.getElementById('btn-export').onclick = () => {
      const data = { apiKey, selectedModel, chats };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'nexus_backup.json';
      a.click();
    };

    document.getElementById('btn-import').onclick = () => document.getElementById('file-import').click();
    document.getElementById('file-import').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const parsed = JSON.parse(event.target.result);
          if (parsed.apiKey) Storage.set('NEXUS_API_KEY', parsed.apiKey);
          if (parsed.selectedModel) Storage.set('NEXUS_MODEL', parsed.selectedModel);
          if (parsed.chats) Storage.set('NEXUS_CHATS', parsed.chats);
          location.reload();
        } catch(err) {
          alert('Invalid JSON file');
        }
      };
      reader.readAsText(file);
    };

    // Run Init
    init();
  </script>
</body>
</html>
