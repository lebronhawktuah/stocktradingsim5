$('#more').onclick=()=>{const m=modal('Menu',h('div',{class:'row'},...[['Export chat',()=>exportDlg()],['Export all',()=>exportDlg(1)],['Import',importDlg],['Clear chat',()=>slash('/clear')],['Settings',settings]].map(([l,f])=>h('button',{onclick:()=>{m.remove();f()}},l))))};
$('#tsearch').onchange=e=>{S.set.search=e.target.checked;save()};$('#tthink').onchange=e=>{S.set.think=e.target.checked;save()};$('#tstream').onchange=e=>{S.set.stream=e.target.checked;save()};
$('#msgs').onclick=e=>{const b=e.target.closest('[data-copy]');if(b)copy(b.closest('.cb').querySelector('code').textContent)};
$('#msgs').onscroll=e=>{const b=e.target;S.follow=b.scrollHeight-b.scrollTop-b.clientHeight<80};
document.addEventListener('paste',e=>{const f=[...(e.clipboardData?.files||[])];if(f.length){e.preventDefault();addFiles(f)}});
addEventListener('dragover',e=>e.preventDefault());addEventListener('drop',e=>{e.preventDefault();if(e.dataTransfer?.files.length)addFiles([...e.dataTransfer.files])});
document.addEventListener('keydown',e=>{const k=e.ctrlKey||e.metaKey;
if(e.key==='Escape'){const m=[...document.querySelectorAll('.mbd')].pop();if(m)m.remove();else{const c=cur();c&&S.busy[c.id]?.abort()}}
else if(k&&e.shiftKey&&e.key.toLowerCase()==='o'){e.preventDefault();$('#nw').click()}else if(k&&e.key===','){e.preventDefault();settings()}else if(k&&e.key==='/'){e.preventDefault();side()}});
addEventListener('online',()=>toast('Back online'));addEventListener('offline',()=>toast('You appear to be offline'));
addEventListener('error',e=>toast('Unexpected error: '+(e.message||'see console')));addEventListener('unhandledrejection',e=>toast('Unexpected error: '+(e.reason?.message||'request failed')));
matchMedia('(prefers-color-scheme:light)').addEventListener?.('change',apply);
if(window.visualViewport)visualViewport.addEventListener('resize',()=>document.documentElement.style.setProperty('--vh',visualViewport.height+'px'));
/* ===== INIT ===== */
apply();if(Store.mode==='memory')$('#ban').hidden=false;if(innerWidth<=720)$('#side').classList.remove('hide');
S.cur=S.chats.length?[...S.chats].sort((a,b)=>b.updated-a.updated)[0].id:null;render();grow();
if(curKey()&&!S.models.length)listModels(curKey()).then(cacheModels).catch(()=>{});
})();
</script></body></html>
